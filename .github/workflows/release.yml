name: Release

# THIS WORKFLOW NO LONGER CUTS RELEASES, AND MUST NOT.
#
# The `whisper` people install is one binary with two halves in it: the client (identity,
# egress, connect, verify, the graph surface, the TUI) and the endpoint (the host sensor and
# the service that supervises it). Only the client half is open source. The endpoint half is
# distributed as a signed binary, so its sources are not in this repository and cannot be.
#
# This workflow cross-compiles THIS tree. Everything it can produce is therefore a `whisper`
# with no `service`, no `sensor` and no `posture` in it. It used to run on every `v*` tag, and
# `install.sh` downloads from `/releases/latest/download`, so a tag pushed here would have
# quietly replaced the product people install with a client that cannot run the sensor they
# installed it for.
#
# The release assets are built once, from the tree that has both halves, signed once with the
# AS219419 release key, and published to this repository's Releases by the build that bakes
# them. One build, one set of bytes, served identically by the release, by the download route
# and by every package channel.
#
# So the tag trigger is gone. What remains is a manual escape hatch for a client-only build,
# behind a confirmation nobody types by accident, and it should be a very unusual thing to run.
#
# THE ESCAPE HATCH DOES NOT PUBLISH EITHER, AND CANNOT.
#
# Removing the tag trigger left the publishing half standing: a manual dispatch still created a
# Release and uploaded dist/whisper-* into it, and install.sh reads
# /releases/latest/download. One dispatch would therefore have replaced the installed product
# for everyone, which is the same outcome the tag trigger was removed to prevent, reached by a
# different button.
#
# The macOS assets make it worse than a client-only swap. A `whisper-darwin-*` that people
# download has to be signed with the Developer ID key and notarized by Apple, or Gatekeeper
# refuses to run it. That key is NOT in this repository's secrets and must never be: a public
# repository has a fork and contributor surface a private one does not, and signing material
# does not go near it. This workflow therefore cannot produce a macOS binary anyone can run,
# and a Release that carries one is a Release that breaks every Mac it reaches.
#
# The build itself is still useful, so nothing is dropped: every binary, checksum and signature
# is uploaded to the workflow run, where a maintainer can download and inspect it. What is gone
# is the Release, the tag it created, and the `contents: write` that let it. An escape hatch
# that hands you the bytes is the design this file already describes; one that publishes them
# was never the design, only the leftover.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (e.g. 1.2.3)
        required: true
      confirm:
        description: >-
          Type "client-only" to confirm you intend to publish a build WITHOUT the endpoint half.
        required: true

# Read-only, deliberately. The job builds and hands the result back through the run's own
# artifact store, which needs no repository write of any kind. Anything that tried to create a
# Release, move a tag or edit an asset would fail on the token, not on someone remembering why
# it must not. The self-check in the first step is the other half of that: it refuses to run at
# all if a publishing step, or this line saying `write`, ever comes back.
permissions:
  contents: read

jobs:
  release:
    name: build · sign · publish (client-only)
    runs-on: ubuntu-latest
    # The signing secrets are NOT job-level env. Job-level env is readable by every step in
    # the job, which here includes ./build-all.sh and three third-party actions, and a signing
    # key that every step can read is a signing key every step can leak. They are scoped to
    # the one step that signs, and that step decides for itself whether it has them.
    steps:
      - name: Confirm this is meant to be a client-only build
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          if [ "$CONFIRM" != "client-only" ]; then
            echo "This workflow builds only the client half of whisper. To publish that" >&2
            echo "deliberately, re-run it and type client-only in the confirm box." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A decision that lives only in a comment is one edit away from being undone by somebody
      # who reads this as a release workflow with a broken ending and helpfully fixes it. So
      # the file checks itself, before it builds anything: if a step that can create or move a
      # Release comes back, or the permission that would let it, the run stops here and says
      # why. Both patterns are anchored at the line shape they are looking for (`uses:` for the
      # action, the start of a line for the permission), so this step does not match itself.
      - name: Refuse to run if this workflow can publish again
        run: |
          set -eu
          wf=.github/workflows/release.yml
          # A missing file makes every grep below find nothing, and finding nothing is how
          # this step says "all clear". Rename or move the workflow and the check would pass
          # by having read no workflow at all, so it asserts the file is there first.
          [ -f "$wf" ] || {
            echo "::error::$wf is not here - the self-check cannot read what it guards" >&2
            echo "If the workflow was renamed, point this check at the new path in the same" >&2
            echo "commit that renames it. Do not delete the check." >&2
            exit 1
          }
          bad=0
          if grep -nE '^[[:space:]]*-?[[:space:]]*uses:.*(action-gh-release|create-release)' "$wf"; then bad=1; fi
          if grep -nE 'gh release (create|upload|edit|delete)' "$wf"; then bad=1; fi
          if grep -nE '^[[:space:]]*contents:[[:space:]]*write' "$wf"; then bad=1; fi
          if [ "$bad" -ne 0 ]; then
            echo "::error::this workflow can publish a release again - refusing to run" >&2
            echo "The lines above put a Release back within reach of a manual dispatch." >&2
            echo "Everything this tree builds is the client half, and its darwin binaries" >&2
            echo "are unsigned and unnotarized, so a Release cut here breaks both the" >&2
            echo "product people installed and every Mac it reaches. The build result" >&2
            echo "belongs on the workflow run; the Releases are cut by the tree that has" >&2
            echo "both halves and the signing key." >&2
            exit 1
          fi
          echo "no publishing step and no contents: write - this run cannot cut a release"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.13'
          cache: true

      - name: Read the version
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          v="${IN_VERSION#v}"
          # A real semver check, not a glob. `[0-9]*.[0-9]*.[0-9]*` accepts
          # `1.2.3" ; id ; echo "` and a value carrying a newline, and this value is
          # operator-supplied and reaches both a shell and $GITHUB_OUTPUT below.
          # grep matches per LINE, so a value carrying a newline passes on its first
          # line alone. Reject any embedded newline before the pattern check.
          [ "$(printf '%s' "$v" | wc -l)" -eq 0 ] \
            || { echo "version must be a single line" >&2; exit 1; }
          printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "not a release version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # build-all.sh reads platforms.txt and emits, for every (os, arch):
      #   dist/whisper-<os>-<arch>[.exe]        the static binary
      #   dist/whisper-<os>-<arch>[.exe].sha256 its SHA-256
      # These names match exactly what install.sh / install.ps1 download.
      # The version reaches the shell as an ENVIRONMENT variable, never interpolated into
      # the script text. A `${{ }}` here is a command-injection sink in a job that imports a
      # signing key one step later.
      - name: Cross-compile all platforms
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./build-all.sh dist "$VERSION"

      # PGP-sign each binary into a detached .asc. The key is imported into an ephemeral
      # keyring; nothing is hardcoded. Signing is ALL-OR-NOTHING: SECURITY.md and both
      # installers tell people to verify a detached signature against a pinned fingerprint,
      # so bytes that leave this job without one turn a documented security step into a dead
      # end. An absent key fails the job instead of handing back unsigned binaries. It says
      # nothing about macOS: a PGP signature is not a Developer ID signature, and Gatekeeper
      # does not read it.
      - name: Sign artifacts (PGP)
        env:
          PGP_SIGNING_KEY: ${{ secrets.PGP_SIGNING_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${PGP_SIGNING_KEY:-}" ] || [ -z "${PGP_PASSPHRASE:-}" ]; then
            echo "::error::no signing key configured, refusing to hand back unsigned binaries" >&2
            echo "SECURITY.md and the installers both instruct users to verify a detached" >&2
            echo "signature; producing bytes without one silently breaks that instruction." >&2
            exit 1
          fi
          # Assigned then exported, not both at once: `export X="$(cmd)"` takes the exit
          # status of `export`, so a failing mktemp would sail past `set -e` and the
          # keyring would be built in whatever directory GNUPGHOME already named.
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s' "$PGP_SIGNING_KEY" | gpg --batch --import
          signed=0
          for f in dist/whisper-*; do
            case "$f" in
              *.sha256|*.asc) continue ;;
            esac
            echo "signing $f"
            printf '%s' "$PGP_PASSPHRASE" | \
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                  --detach-sign --armor --output "$f.asc" "$f"
            # Read every signature back. A file written is not a signature that verifies,
            # and the difference only shows up on the user's machine.
            gpg --batch --verify "$f.asc" "$f"
            signed=$((signed + 1))
          done
          # An empty loop leaves signed=0 and would otherwise report success having signed
          # nothing at all - the exact shape of an absence that reads as a pass.
          if [ "$signed" -eq 0 ]; then
            echo "::error::no binaries were signed - dist/ matched nothing" >&2
            exit 1
          fi
          echo "signed and verified $signed binaries"
          # Scrub the ephemeral keyring.
          rm -rf "$GNUPGHOME"

      # One release-wide checksum manifest over every binary asset.
      - name: Generate checksums.txt
        run: |
          set -eu
          cd dist
          : > checksums.txt
          for f in whisper-*; do
            case "$f" in
              *.sha256|*.asc|checksums.txt) continue ;;
            esac
            sha256sum "$f" >> checksums.txt
          done
          echo "----- checksums.txt -----"
          cat checksums.txt

      # Where a Release used to be created. The bytes go to the run, not to the world:
      # downloadable by anyone who can see the run, reachable by no installer, no package
      # channel and no /releases/latest/download. `if-no-files-found: error` keeps the old
      # `fail_on_unmatched_files` property, because a green run that uploaded nothing is the
      # shape of an absence that reads as a pass.
      - name: Upload the build to this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whisper-client-only-${{ steps.ver.outputs.version }}
          if-no-files-found: error
          path: |
            dist/whisper-*
            dist/checksums.txt

      # Say it in the run, not only in this file. Whoever dispatched this was reaching for a
      # release; they get a build instead, and they should be told exactly what they are
      # holding while they are still looking at it.
      - name: What this build is, and what it is not
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          echo "::warning::v$VERSION was BUILT, not released. No GitHub Release was created."
          echo "::warning::The darwin binaries are UNSIGNED: no Developer ID signature, no"
          echo "::warning::Apple notarization. Gatekeeper will refuse them. Do not distribute."
          {
            echo "## Client-only build v$VERSION"
            echo
            echo "Downloadable from this run. **Not published, and not installable by anyone.**"
            echo
            echo "- No GitHub Release was created and no tag was moved. \`install.sh\` reads"
            echo "  \`/releases/latest/download\`, which this run did not touch."
            echo "- This tree is the client half only: no \`service\`, no \`sensor\`, no \`posture\`."
            echo "- The \`whisper-darwin-*\` binaries carry no Developer ID signature and are not"
            echo "  notarized, because the signing material is deliberately not in this repository."
            echo "  Gatekeeper refuses them. They are here to be inspected, not handed to anyone."
            echo "- The real release assets are built, signed and published by the tree that has"
            echo "  both halves. Nothing here can replace them."
          } >> "$GITHUB_STEP_SUMMARY"
