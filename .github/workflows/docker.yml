name: Docker image

# THIS WORKFLOW BUILDS THE CLIENT HALF ONLY, AND MUST NOT FIRE ON A VERSION TAG.
#
# Same reasoning as release.yml in this directory. The image is built from THIS tree, which
# carries the client (identity, egress, connect, verify, the graph surface, the TUI) and not
# the endpoint half: the sensor is distributed as a signed binary and its sources are not
# here. So everything this workflow can produce is a `whisper` with no `service`, `sensor` or
# `posture` in it.
#
# It used to run on every `v*` tag, and its final step pushes BOTH
# `ghcr.io/whisper-sec/whisper:latest` and `:<version>`. The README advertises `:latest` as
# the official image and server.json pins the MCP server to that repository, so a version tag
# pushed here quietly replaced the container people pull, and the MCP server with it. That is
# the same defect release.yml carried, on a second channel, and it fires on the same tag.
#
# What remains is a manual build behind a confirmation nobody types by accident.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp and tag, without the leading v (e.g. 1.2.3)'
        required: true
      confirm:
        description: >-
          Type "client-only" to confirm you intend to publish an image WITHOUT the endpoint half.
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm this is meant to be a client-only image
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          if [ "$CONFIRM" != "client-only" ]; then
            echo "This workflow builds only the client half of whisper, and it publishes over" >&2
            echo "ghcr.io/whisper-sec/whisper:latest. To do that deliberately, re-run it and" >&2
            echo "type client-only in the confirm box." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The version arrives through the environment, never interpolated into the shell.
      # A ${{ }} expansion inside a run block is expanded by the runner BEFORE bash sees it,
      # so a crafted input becomes shell in a job that holds packages: write.
      - name: Resolve version
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          v="${IN_VERSION#v}"
          # A real semver check, not a glob. `[0-9]*.[0-9]*.[0-9]*` accepts
          # `1.2.3" ; id ; echo "` and a value carrying a newline, and this value is
          # operator-supplied and reaches both a shell and $GITHUB_OUTPUT below.
          # grep matches per LINE, so a value carrying a newline passes on its first
          # line alone. Reject any embedded newline before the pattern check.
          [ "$(printf '%s' "$v" | wc -l)" -eq 0 ] \
            || { echo "version must be a single line" >&2; exit 1; }
          printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "not a release version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building image version $v"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          # OCI annotation so the MCP Registry can verify this image belongs to the server.
          annotations: |
            io.modelcontextprotocol.server.name=io.github.whisper-sec/whisper
          tags: |
            ghcr.io/whisper-sec/whisper:latest
            ghcr.io/whisper-sec/whisper:${{ steps.ver.outputs.version }}
