name: whisper-cli
base: core24
version: '0.213.1'
summary: A routable Whisper IPv6 identity and safe egress for agents
description: |
  The official Whisper CLI: give an AI agent a real, routable IPv6 /128 identity
  (AS219419), verifiable from the outside, with safe egress that leaves from that
  address. Register, connect, and verify in one command.
license: MIT
source-code: https://github.com/whisper-sec/whisper-cli

# Strict confinement. Two file surfaces and one network surface:
#  - `whisper init` writes project-level .claude/settings.local.json, .whisper/
#    and .gitignore into the developer's current project directory under $HOME.
#    These project-level hidden files are reachable through the `home` interface
#    (home only excludes dotfiles at the TOP of $HOME, not inside a project dir).
#    Projects outside $HOME (/srv, /opt, mounted volumes) are intentionally not
#    supported - that is the arbitrary-path case, out of scope for a snap.
#  - The CLI's own global state lives in ~/.config/whisper (identity, key,
#    session registry). That is granted by the `dot-config-whisper`
#    personal-files plug (the app's own namespaced dir under ~/.config).
#  - `whisper connect` runs a local user-space SOCKS5 egress proxy: `network` +
#    `network-bind`. The optional routed WireGuard tier uses `network-control`
#    (connect it manually: `snap connect whisper-cli:network-control`).
confinement: strict
grade: stable

# This snap is BUILT FROM SOURCE, from the tag above, so it is the client: identity,
# egress, connect, verify, the security-graph surface and the TUI. It does not carry the
# endpoint sensor, which is distributed as a binary and not as source, so `whisper
# service`, `whisper sensor` and `whisper posture` are not in it. The channels that ship
# the full binary are the release assets, the install one-liner, apt, dnf, apk, brew and
# scoop. See "Source here, binaries there" in the README.

plugs:
  dot-config-whisper:
    interface: personal-files
    write:
      - $HOME/.config/whisper

parts:
  whisper:
    plugin: go
    source: https://github.com/whisper-sec/whisper-cli.git
    source-tag: v0.213.1
    build-snaps: [go]
    build-environment:
      - CGO_ENABLED: "0"
    override-build: |
      # The version is DERIVED from `version:` above, never typed here. It WAS typed here and it
      # drifted: the ldflag on this line still said 0.211.0 while `version:` and `source-tag:`
      # moved on, so the snap would have declared one version in the store and shipped a binary
      # reporting another. internal/cli/root.go honours an ldflag verbatim and deliberately
      # skips its build-info fallback when one was applied, so nothing downstream could have
      # corrected it - and `whisper --version` is how a person, or a scanner, decides whether
      # they are exposed to an advisory.
      #
      # BOTH names, on purpose, because which ones are set depends on the base. core22 routes
      # through snapcraft/parts/lifecycle.py and sets SNAPCRAFT_PROJECT_VERSION only; core24 -
      # which this snap is - routes through craft-application, and snapcraft/services/project.py
      # calls BOTH its parent (CRAFT_PROJECT_VERSION) and set_global_environment
      # (SNAPCRAFT_PROJECT_VERSION), so on core24 both exist and read the same `version:` key.
      # Written as a fallback rather than picking one because the answer is base-dependent and
      # a wrong single name fails the build: the docs table lists SNAPCRAFT_PROJECT_VERSION
      # with no CRAFT_ counterpart, which is true of the core22 path it describes and reads as
      # a general rule. Both were read out of the installed snapcraft, not out of the docs.
      #
      # The `:?` on the fallback is load-bearing: `set -u`, which craft-parts applies to this
      # scriptlet, catches UNSET and not SET-TO-EMPTY, and empty is reachable - snapcraft reads
      # the literal `version:` key, so switching this file to adopt-info yields an empty string.
      # An empty ldflag builds GREEN and ships a binary with no --version flag at all, because
      # cobra does not register one when Version is empty. That is worse than a stale literal:
      # a stale version at least answers.
      go build -trimpath \
        -ldflags "-s -w -X github.com/whisper-sec/whisper-cli/internal/cli.Version=${SNAPCRAFT_PROJECT_VERSION:-${CRAFT_PROJECT_VERSION:?neither SNAPCRAFT_PROJECT_VERSION nor CRAFT_PROJECT_VERSION was set by snapcraft}}" \
        -o "$CRAFT_PART_INSTALL/bin/whisper" ./cmd/whisper

apps:
  whisper:
    command: bin/whisper
    plugs:
      - home
      - network
      - network-bind
      - network-control
      - dot-config-whisper
